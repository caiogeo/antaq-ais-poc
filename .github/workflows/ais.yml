name: AIS ao vivo Brasil

on:
  # Agendamento pausado em 05/10/2026 a pedido do administrador do Enterprise da Imagem (o alimentador passou a rodar lá).
  # Para religar, descomentar as duas linhas abaixo.
  # schedule:
  #   - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"   # fora dos múltiplos de 5 e da virada da hora, que o GitHub descarta mais
  workflow_dispatch:

concurrency:
  group: ais-ao-vivo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alimentar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python alimentador.py
        env:
          ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          ESCUTA_S: "230"
